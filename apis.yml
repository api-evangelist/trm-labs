name: TRM Labs
description: >-
  TRM Labs is a blockchain intelligence company that helps financial
  institutions, crypto businesses, and government agencies detect and
  investigate crypto-related fraud, money laundering, and sanctions violations.
  Its public API surface includes the TRM Sanctions API for screening
  blockchain addresses against sanctions lists, and the Chainabuse Public API
  (community-sourced scam reporting) for contributing, retrieving, and looking
  up reports of malicious addresses, tokens, transactions, and domains. Both
  APIs use HTTP Basic authentication and are documented at docs.trmlabs.com.
